name: Android CI Bypass Protection

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Clean Hardcoded Paths & Exclude WADs
      run: |
        # Удаляем жестко прописанный путь автора к Java
        sed -i '/org.gradle.java.home/d' gradle.properties
        
        # Удаляем встроенные файлы Freedoom для облегчения APK
        find . -name "freedoom1.wad" -delete
        find . -name "freedoom2.wad" -delete

    - name: Pre-Configure App ABI
      run: |
        # Гарантируем сборку только под 64-бит
        sed -i 's/APP_ABI := .*/APP_ABI := arm64-v8a/g' doom/src/main/jni/Application.mk || true

    - name: Build C++ Native Engine
      run: |
        export ANDROID_NDK_HOME=$(ls -d $ANDROID_HOME/ndk/27* | head -n 1)
        export PATH=$ANDROID_NDK_HOME:$PATH
        chmod +x build_native.sh
        chmod +x gradlew
        ./build_native.sh

    - name: Force Binary Stripping (Bypass Debug Size)
      run: |
        export ANDROID_NDK_HOME=$(ls -d $ANDROID_HOME/ndk/27* | head -n 1)
        # Находим инструмент llvm-strip
        STRIP_TOOL=$(find $ANDROID_NDK_HOME -name "llvm-strip" | head -n 1)
        # Принудительно вычищаем все .so библиотеки до состояния чистейшего Release
        find doom/src/main/libs/arm64-v8a/ -name "*.so" -exec $STRIP_TOOL --strip-all {} \; || true

    - name: Build APK
      run: ./gradlew :doom:assembleDebug

    - name: Sign APK (For easy installation)
      run: |
        APK_PATH=$(find doom/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
        keytool -genkey -v -keystore test.keystore -alias test -keyalg RSA -keysize 2024 -validity 10000 -dname "CN=AndroidDebug,O=Android,C=US" -storepass android -keypass android
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks test.keystore --ks-key-alias test --ks-pass pass:android --key-pass pass:android --out doom/build/outputs/apk/debug/GZDoom-2026-Stripped.apk $APK_PATH

    - name: Upload Optimized APK
      uses: actions/upload-artifact@v4
      with:
        name: GZDoom-2026-Stripped-Arm64
        path: doom/build/outputs/apk/debug/GZDoom-2026-Stripped.apk
