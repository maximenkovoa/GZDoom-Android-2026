name: Android CI

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Clean Hardcoded Paths
      run: |
        # Удаляем жестко прописанный путь автора к Java
        sed -i '/org.gradle.java.home/d' gradle.properties
        # Удаляем встроенные файлы Freedoom из ресурсов перед сборкой для облегчения APK
        find . -name "freedoom1.wad" -delete
        find . -name "freedoom2.wad" -delete

    - name: Grant execute permissions
      run: |
        chmod +x gradlew
        chmod +x build_native.sh

    - name: Build C++ Native Engine (Only arm64-v8a)
      run: |
        # Находим предустановленный NDK r27 на виртуальной машине
        export ANDROID_NDK_HOME=$(ls -d $ANDROID_HOME/ndk/27* | head -n 1)
        echo "Found NDK path: $ANDROID_NDK_HOME"
        # Добавляем путь к ndk-build в системный PATH, чтобы скрипт его точно увидел
        export PATH=$ANDROID_NDK_HOME:$PATH

    - name: Build RELEASE APK with Gradle
      run: ./gradlew :doom:assembleRelease

    - name: Sign Release APK (For easy installation)
      run: |
        APK_PATH=$(find doom/build/outputs/apk/release/ -name "*.apk" | head -n 1)
        # Создаем тестовый ключ на лету для безопасной установки на Android 12+
        keytool -genkey -v -keystore test.keystore -alias test -keyalg RSA -keysize 2024 -validity 10000 -dname "CN=AndroidDebug,O=Android,C=US" -storepass android -keypass android
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks test.keystore --ks-key-alias test --ks-pass pass:android --key-pass pass:android --out doom/build/outputs/apk/release/GZDoom-2026-Optimized.apk $APK_PATH

    - name: Upload Clean APK
      uses: actions/upload-artifact@v4
      with:
        name: GZDoom-2026-Light-Arm64
        path: doom/build/outputs/apk/release/GZDoom-2026-Optimized.apk
