name: Android CI

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Prepare sources & patches
      run: |
        # Удаляем жестко прописанный путь автора к Java
        sed -i '/org.gradle.java.home/d' gradle.properties

        # Удаляем старые 32-битные .so, чтобы в APK попали только свежие arm64-v8a
        rm -rf doom/src/main/libs/armeabi-v7a

        # Включаем вторую кнопку стрельбы (attack2) над областью бега в C++
        sed -i 's/"attack2", touchcontrols::RectF(3, 5, 6, 8), "shoot", KEY_SHOOT, false, true/"attack2", touchcontrols::RectF(3, 4, 6, 7), "shoot", KEY_SHOOT, false, false/' \
          doom/src/main/jni/Clibs_OpenTouch/idtech1/touch_interface.cpp

        # Включаем GAME_OPTION_TOUCHJOY_MULTITOUCH (0x2000)
        sed -i 's/options |= 0x10;/options |= 0x10 | 0x2000;/' \
          doom/src/main/java/org/libsdl/app/SDLOpenTouch.java

        # Гарантируем arm64-v8a в Application.mk
        sed -i 's/^APP_ABI.*/APP_ABI := arm64-v8a/' doom/src/main/jni/Application.mk

        # Ограничиваем FPS по умолчанию
        sed -i 's/+set midi_dmxgus 0/+set midi_dmxgus 0 +set vid_maxfps 35/' \
          doom/src/main/java/com/msa/freedoom/ui/launch/LaunchArgs.kt

    - name: Rebuild engine PK3 assets cleanly (using official compile.py)
      run: |
        sudo apt-get update && sudo apt-get install -y zip
        TRANS_SCRIPT="doom/src/main/jni/engine/gzdoom/libraries/Translation/scripts/compile.py"

        if [ -f "$TRANS_SCRIPT" ] && [ -d "doom/src/main/jni/engine/gzdoom/wadsrc/static" ]; then
          python3 "$TRANS_SCRIPT" --recipe ENGINE --output doom/src/main/jni/engine/gzdoom/wadsrc/static/language.csv
          rm -f doom/src/main/assets/uzdoom.pk3
          (cd doom/src/main/jni/engine/gzdoom/wadsrc/static && zip -r -9 "$GITHUB_WORKSPACE/doom/src/main/assets/uzdoom.pk3" .)
        fi

        if [ -f "$TRANS_SCRIPT" ] && [ -d "doom/src/main/jni/engine/gzdoom/wadsrc_extra/static" ]; then
          python3 "$TRANS_SCRIPT" --recipe GAMES --output doom/src/main/jni/engine/gzdoom/wadsrc_extra/static/language.csv
          rm -f doom/src/main/assets/uzdoom_game_support.pk3
          (cd doom/src/main/jni/engine/gzdoom/wadsrc_extra/static && zip -r -9 "$GITHUB_WORKSPACE/doom/src/main/assets/uzdoom_game_support.pk3" .)
        fi

        if [ -d "doom/src/main/jni/engine/gzdoom/wadsrc_wide/static" ]; then
          rm -f doom/src/main/assets/game_widescreen_gfx.pk3
          (cd doom/src/main/jni/engine/gzdoom/wadsrc_wide/static && zip -r -9 "$GITHUB_WORKSPACE/doom/src/main/assets/game_widescreen_gfx.pk3" .)
        fi

    - name: Grant execute permissions
      run: |
        chmod +x gradlew
        chmod +x build_native.sh

    - name: Build C++ Native Engine (arm64-v8a)
      run: |
        export ANDROID_NDK_HOME=$(ls -d $ANDROID_HOME/ndk/27* | sort -V | tail -1)
        echo "Found NDK path: $ANDROID_NDK_HOME"
        ./build_native.sh APP_OPTIM=release

    - name: Build RELEASE APK with Gradle
      run: ./gradlew :doom:assembleRelease --stacktrace

    - name: Align (16KB) & Sign Release APK
      run: |
        BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
        UNSIGNED_APK=$(find doom/build/outputs/apk/release/ -name "*.apk" | head -n 1)
        ALIGNED_APK="doom/build/outputs/apk/release/aligned.apk"
        FINAL_APK="doom/build/outputs/apk/release/GZDoom-2026.apk"

        "$BUILD_TOOLS/zipalign" -P 16 -f -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"

        keytool -genkey -v -keystore test.keystore -alias test -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=AndroidRelease,O=Android,C=US" -storepass android -keypass android

        "$BUILD_TOOLS/apksigner" sign --ks test.keystore --ks-key-alias test \
          --ks-pass pass:android --key-pass pass:android \
          --out "$FINAL_APK" "$ALIGNED_APK"

    - name: Upload Clean APK
      uses: actions/upload-artifact@v4
      with:
        name: GZDoom-2026
        path: doom/build/outputs/apk/release/GZDoom-2026.apk
